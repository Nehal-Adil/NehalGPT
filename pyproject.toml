[project]
name = "nehalgpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nehal Adil", email = "mdnehaladil@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx>=0.2.4",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
nehalgpt = "nehalgpt:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.2",
]
